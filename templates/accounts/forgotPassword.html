{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-content padding-y" style="min-height:84vh">  

  <div class="card mx-auto shadow" style="max-width: 600px; margin-top:100px; border-radius: 10px;">
    <div class="card-body">
      <h4 class="card-title mb-4 text-center">Forgot Password</h4>
      {% include 'includes/alerts.html' %}
      
      <form action="{% url 'forgotPassword' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
          <input type="email" class="form-control" placeholder="Enter Your Email" name="email" required>
        </div>
       
        <div class="form-group d-flex justify-content-between">
          <a href="{% url 'login' %}" class="text-primary">Got Password? Login</a>
        </div>

        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <p class="text-center mt-4">
    Don't have an account? 
    <a href="{% url 'register' %}" class="text-success font-weight-bold">Sign Up</a>
  </p>

  <br><br>
</section>

{% endblock %}
