{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
    .container {
        max-width: 80% !important; /* Page ko beech me laya */
        margin: 0 auto;
    }
    .row {
        justify-content: center;
    }
</style>

<section class="section-content padding-y bg">
<div class="container">

<div class="row">
	<aside class="col-lg-6">
		<div class="card">
			<div class="card-body">
				<h4 class="card-tittle mb-4">Billing  Address</h4>
				<form action="{% url 'place_order' %}" method="post">
					{% csrf_token %}
					<div class="form-row">
						<div class="form-group col-md-6">
							<label>First Name</label>
							<input type="text" name="first_name" class="form-control" placeholder="Enter your first name" required>
						</div>
						<div class="form-group col-md-6">
							<label>Last Name</label>
							<input type="text" name="last_name" class="form-control" placeholder="Enter your last name" required>
						</div>
					</div>

					<div class="form-group">
						<label>Email</label>
						<input type="email" name="email" class="form-control" placeholder="Enter your email" required>
					</div>

					<div class="form-group">
						<label>Phone</label>
						<input type="text" name="phone" class="form-control" placeholder="Enter your phone number" required>
					</div>

					<div class="form-group">
						<label>Address Line 1</label>
						<input type="text" name="address_line_1" class="form-control" placeholder="Enter your address" required>
					</div>

					<div class="form-group">
						<label>Address Line 2</label>
						<input type="text" name="address_line_2" class="form-control" placeholder="Apartment, suite, etc. (optional)">
					</div>

					<div class="form-row">
						<div class="form-group col-md-4">
							<label>City</label>
							<input type="text" name="city" class="form-control" placeholder="Enter your city" required>
						</div>
						<div class="form-group col-md-4">
							<label>State</label>
							<input type="text" name="state" class="form-control" placeholder="Enter your state" required>
						</div>
						<div class="form-group col-md-4">
							<label>Zip Code</label>
							<input type="text" name="zip_code" class="form-control" placeholder="Enter your zip code" required>
						</div>
					</div>

					<div class="form-group">
						<label>Country</label>
						<input type="text" name="country" class="form-control" placeholder="Enter your country" required>
					</div>

					<div class="form-group">
						<label>Order Notes</label>
						<textarea name="order_notes" class="form-control" rows="2" placeholder="Enter any special instructions"></textarea>
					</div>
				
			</div>
		</div>
	</aside>

	<aside class="col-lg-6">
		<div class="card">
			<div class="card-body">
				<table class="table table-borderless table-shopping-cart">
					<thead class="text-muted">
						<tr class="small text-uppercase">
							<th scope="col">Product</th>
							<th scope="col" width="120">Quantity</th>
							<th scope="col" width="120">Price</th>
							<th scope="col" class="text-right" width="200"></th>
						</tr>
					</thead>
					<tbody>
    {% for cart_item in cart_items %}
    <tr>
        <td>
            <figure class="itemside align-items-center">
                <div class="aside">
                    <img src="{{ cart_item.product.images.url}}" class="img-sm">
                </div>
                <figcaption class="info">
                    <a href="{{cart_item.product.get_url}}" class="title text-dark">{{cart_item.product.product_name}}</a>
                    <p class="text-muted small">Color: {{ cart_item.color }} <br>Size: {{ cart_item.size }}</p>

                   
                </figcaption>
            </figure>
        </td>

		
        <td>
           <label class="form-label">{{cart_item.quantity}}</label>
            
        </td>
        <td>
            <div class="price-wrap">
                <var class="price">Rs.{{cart_item.sub_total}}</var>
                <small class="text-muted"> Rs.{{cart_item.product.price }} each </small>
            </div>
        </td>
    </tr>
    {% endfor %}
	
</tbody>

				</table>

				
				<button type="submit" name="submit" class="btn btn-primary btn-block">Place Order</button>
				<a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
				</form>
			</div>
		</div>
	</aside>
</div>

</div>
</section>
{% endblock %}
